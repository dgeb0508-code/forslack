<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --late: #f06d61; --late-soft: #3a1f1c; --soon: #e3aa4c; --soon-soft: #36291a; --sub: #7aa2ea; --sub-soft: #1d2840; --done: #8a9a92; --done-soft: #232c28;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark; } }

  --accent: #4fb393; --accent-ink: #0d1612; --accent-soft: #1d3129;
  --late: #f06d61; --late-soft: #3a1f1c; --soon: #e3aa4c; --soon-soft: #36291a; --sub: #7aa2ea; --sub-soft: #1d2840; --done: #8a9a92; --done-soft: #232c28;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark; }

/* 작업 목록 */

// ───────── 화면 상태 ─────────
const S = { me: null, view: 'home', pid: null, tab: 'tasks', taskId: null, onlyMine: false, showAssign: false, bellOpen: false, pendingFiles: [], simStep: 0,
  notifs: Object.fromEntries(Object.keys(users).map(u => [u, []])),
  mute: {} }; // mute[uid+pid] = 'all' | 'mention' | 'off'
const STATUS = { assigned: '지시됨', doing: '진행중', submitted: '제출됨', revise: '수정요청', done: '완료' };

// ───────── 도우미 ─────────
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const U = id => users[id];
const isProf = () => U(S.me).role === 'prof';
const P = id => projects.find(p => p.id === id);
const T = id => tasks.find(t => t.id === id);
const myProjects = () => projects.filter(p => p.members.includes(S.me));
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDue = d => `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})`;
const fmtAt = d => { const h = (Date.now() - d) / 3600e3; if (h < 1 / 60) return '방금'; if (h < 1) return `${Math.floor(h * 60)}분 전`; if (h < 24) return `${Math.floor(h)}시간 전`; return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1e3)) + 'KB';
const av = id => `<span class="av ${U(id).role === 'prof' ? 'prof' : ''}" title="${esc(U(id).name)}">${esc(U(id).name.slice(-2))}</span>`;
const names = ids => ids.map(i => U(i).name).join(', ');
function dday(t) {
  if (t.status === 'done') return { label: '완료', cls: 'done', n: 999 };
  const n = Math.round((new Date(t.due).setHours(0, 0, 0, 0) - today) / DAY);
  return { label: n > 0 ? `D-${n}` : n === 0 ? 'D-day' : `D+${-n}`, cls: n < 0 ? 'late' : n <= 3 ? 'soon' : 'ok', n };
}
const sortTasks = list => [...list].sort((a, b) => (a.status === 'done') - (b.status === 'done') || a.due - b.due);
const muteOf = (uid, pid) => S.mute[uid + pid] || 'all';
const mentionsIn = (text, pid) => P(pid).members.filter(u => text.includes('@' + U(u).name));
const hl = (text, pid) => { let h = esc(text); P(pid).members.forEach(u => { h = h.split('@' + esc(U(u).name)).join(`<span class="mention">@${esc(U(u).name)}</span>`); }); return h; };

// ───────── 알림 ─────────
function notify(uid, text, pid, taskId) {
  if (!uid || uid === S.actor) return;
  const n = { text, pid, taskId, at: new Date(), read: false };
  S.notifs[uid].unshift(n);
  if (uid !== S.me) return;
  showToast(n);
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('랩데스크', { body: text }); } catch (e) {}
}
function showToast(n) {
  const box = document.getElementById('toasts');
  const el = document.createElement('button');
  el.className = 'toast';
  el.innerHTML = `<b>${esc(n.text)}</b><small>${esc(P(n.pid).name)} · 방금</small>`;
  el.onclick = () => { openNotif(n); el.remove(); };
  box.prepend(el);
  setTimeout(() => el.remove(), 6000);
}
function openNotif(n) {
  n.read = true; S.view = 'project'; S.pid = n.pid; S.bellOpen = false;
  if (n.taskId) { S.taskId = n.taskId; S.tab = 'tasks'; } else { S.taskId = null; S.tab = 'chat'; }
  render();
}
let permMsg = '';
async function askPermission() {
  try {
    if (!('Notification' in window)) throw 0;
    const r = await Notification.requestPermission();
    permMsg = r === 'granted' ? '브라우저 알림이 켜졌습니다. 다른 창을 보고 있어도 알림이 뜹니다.' : '이 미리보기 창에서는 브라우저 알림이 막혀 있습니다. 실제 사이트에서는 운영체제 알림으로 뜨고, 여기서는 화면 오른쪽 아래 알림으로 대신 보여드립니다.';
  } catch (e) { permMsg = '이 미리보기 창에서는 브라우저 알림이 막혀 있습니다. 실제 사이트에서는 운영체제 알림으로 뜨고, 여기서는 화면 오른쪽 아래 알림으로 대신 보여드립니다.'; }
  render();
}

// ───────── 동작 (누가 했는지 S.actor 로 기록) ─────────
function act(actor, fn) { const prev = S.actor; S.actor = actor; try { fn(); } finally { S.actor = prev; } }
function post(pid, by, type, text, taskId) { feed.push({ pid, at: new Date(), type, by, text, taskId }); }
const profsOf = pid => P(pid).members.filter(u => U(u).role === 'prof');

function assignTask(by, pid, title, desc, assignees, due) {
  const t = { id: 't' + (++seq), pid, title, desc, assignees, due, status: 'assigned', subs: [], comments: [] };
  tasks.push(t);
  post(pid, by, 'ev', `「${title}」를 ${names(assignees)} 님에게 지시했습니다 (마감 ${fmtDue(due)})`, t.id);
  assignees.forEach(u => notify(u, `새 작업: 「${title}」 마감 ${fmtDue(due)}`, pid, t.id));
}
function submitTask(by, t, memo, files, link) {
  const v = t.subs.length + 1;
  t.subs.push({ v, by, at: new Date(), memo, files, link });
  t.status = 'submitted';
  post(t.pid, by, 'ev', `「${t.title}」 결과를 제출했습니다 (v${v})`, t.id);
  profsOf(t.pid).forEach(u => notify(u, `${U(by).name} 님이 「${t.title}」를 제출했습니다 (v${v}) · 확인 필요`, t.pid, t.id));
}
function reviewTask(by, t, ok, note) {
  t.status = ok ? 'done' : 'revise';
  if (note) t.comments.push({ by, at: new Date(), text: (ok ? '' : '[수정 요청] ') + note });
  post(t.pid, by, 'ev', ok ? `「${t.title}」를 완료 처리했습니다` : `「${t.title}」에 수정을 요청했습니다`, t.id);
  t.assignees.forEach(u => notify(u, ok ? `「${t.title}」 완료 처리됨` : `「${t.title}」 수정 요청: ${note}`, t.pid, t.id));
}
function commentTask(by, t, text) {
  t.comments.push({ by, at: new Date(), text });
  [...new Set([...t.assignees, ...profsOf(t.pid)])].forEach(u => notify(u, `${U(by).name} 님의 댓글 · 「${t.title}」: ${text}`, t.pid, t.id));
}
function chat(by, pid, text) {
  post(pid, by, 'msg', text);
  const mentioned = mentionsIn(text, pid);
  P(pid).members.forEach(u => {
    const m = muteOf(u, pid), hit = mentioned.includes(u);
    if (m === 'all' || (m === 'mention' && hit)) notify(u, `${U(by).name}${hit ? ' 님이 회원님을 호출했습니다' : ''}: ${text}`, pid);
  });
}

// ───────── 다른 사람이 보낸 것처럼 보여주는 데모 이벤트 ─────────
function simulate() {
  const step = S.simStep++;
  if (isProf()) {
    const t = tasks.find(t => t.status === 'doing' && t.assignees.some(u => U(u).role === 'student'));
    if (step % 2 === 0 && t) {
      const by = t.assignees[0];
      act(by, () => submitTask(by, t, '정리해서 올립니다. 확인 부탁드립니다.', [{ name: '결과_정리_v' + (t.subs.length + 1) + '.pdf', size: 820000 }], ''));
    } else {
      act('u4', () => chat('u4', 'p2', '교수님, Figure 3 수정본 오늘 저녁까지 올리겠습니다.'));
    }
  } else {
    const p = myProjects()[step % myProjects().length];
    const mine = tasks.find(t => t.pid === p.id && t.assignees.includes(S.me) && t.status !== 'done');
    if (step % 2 === 1 && mine) act('u1', () => commentTask('u1', mine, '진행 상황 어떤가요? 막히는 부분 있으면 여기 남겨 주세요.'));
    else act('u1', () => chat('u1', p.id, `@${U(S.me).name} 내일 미팅 전에 진행한 내용 한 번 공유해 주세요.`));
  }
  render();
}

function projectView() {
  const p = P(S.pid), ts = tasks.filter(t => t.pid === p.id);
  const shown = sortTasks(S.onlyMine ? ts.filter(t => t.assignees.includes(S.me)) : ts);
  const subs = ts.flatMap(t => t.subs.map(s => ({ ...s, t }))).sort((a, b) => b.at - a.at);
  const m = muteOf(S.me, p.id);
  const students = p.members.filter(u => U(u).role === 'student');
  let body = '';
  if (S.tab === 'tasks') body = `
    <div class="toolbar"><label class="check"><input type="checkbox" id="only-mine" ${S.onlyMine ? 'checked' : ''}> 내 작업만 보기</label>
      ${isProf() ? `<button class="btn primary" data-act="toggle-assign">${S.showAssign ? '닫기' : '+ 작업 지시'}</button>` : ''}</div>
    ${S.showAssign ? `<form class="panel assign" id="assign-form">
      <div class="field"><label for="as-title">작업 제목</label><input id="as-title" required placeholder="예: 실험 결과 표 정리"></div>
      <div class="field"><label for="as-desc">내용</label><textarea id="as-desc" placeholder="무엇을, 어느 수준까지 해 오면 되는지"></textarea></div>
      <div class="row"><div class="field"><label>담당자</label><div class="chips">${students.map(u => `<label><input type="checkbox" name="as-who" value="${u}"> ${esc(U(u).name)}</label>`).join('')}</div></div>
      <div class="field"><label for="as-due">마감일</label><input id="as-due" type="date" required value="${new Date(today.getTime() + 7 * DAY + 9 * 3600e3).toISOString().slice(0, 10)}"></div></div>
      <div class="btns"><button class="btn primary" type="submit">지시하기</button><span class="muted small" id="as-err"></span></div></form>` : ''}
    <div class="panel tlist">${shown.length ? shown.map(t => taskRow(t)).join('') : '<div class="empty">작업이 없습니다.</div>'}</div>`;
  else if (S.tab === 'chat') body = `
    <div class="panel chat"><div class="feed" id="feed">${feed.filter(f => f.pid === p.id).map(f => f.type === 'ev'
      ? `<div class="ev">${av(f.by)}<span><b>${esc(U(f.by).name)}</b> ${esc(f.text)}</span>${f.taskId ? `<button data-act="task" data-id="${f.taskId}">열기</button>` : ''}<span class="small">${fmtAt(f.at)}</span></div>`
      : `<div class="msg ${f.by === S.me ? 'mine' : ''}">${av(f.by)}<div class="bub"><div class="meta">${esc(U(f.by).name)} · ${fmtAt(f.at)}</div>${hl(f.text, p.id)}</div></div>`).join('')}</div>
      <form class="compose" id="chat-form"><input id="chat-in" placeholder="메시지 입력 · @이름 으로 호출" autocomplete="off"><button class="btn primary" type="submit">보내기</button></form></div>
    <p class="muted small" style="margin:0">작업 지시, 제출, 완료, 수정요청은 이 대화방에 자동으로 기록됩니다. 따로 보고 메시지를 쓰지 않아도 됩니다.</p>`;
  else body = `<div class="panel table-wrap">${subs.length ? `<table><thead><tr><th>파일 / 링크</th><th>작업</th><th>버전</th><th>올린 사람</th><th>올린 때</th></tr></thead><tbody>
    ${subs.map(s => `<tr class="click" data-act="task" data-id="${s.t.id}"><td>${s.files.map(f => `<div class="file">${esc(f.name)} <span class="muted">${fmtSize(f.size)}</span></div>`).join('')}${s.link ? `<div class="file">🔗 ${esc(s.link)}</div>` : ''}</td><td>${esc(s.t.title)}</td><td class="num">v${s.v}</td><td>${esc(U(s.by).name)}</td><td class="muted small">${fmtAt(s.at)}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">아직 제출된 자료가 없습니다.</div>'}</div>
    <p class="muted small" style="margin:0">자료실은 따로 올리는 곳이 아니라 각 작업에 제출된 파일을 모아 보여주는 화면입니다.</p>`;
  return `<section class="phead">
    <button class="crumb" data-act="go" data-view="home">← 프로젝트 목록</button>
    <h1>${esc(p.name)}</h1><p class="muted" style="margin:0">${esc(p.desc)}</p>
    <div class="prow"><div class="avs">${p.members.map(av).join('')}</div>
      <label class="small muted">이 프로젝트 알림 <select id="mute-sel"><option value="all" ${m === 'all' ? 'selected' : ''}>모든 메시지</option><option value="mention" ${m === 'mention' ? 'selected' : ''}>나를 호출할 때만</option><option value="off" ${m === 'off' ? 'selected' : ''}>대화 알림 끄기</option></select></label></div>
  </section>
  <div style="display:grid;gap:16px">
    <div class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-tab="tasks" aria-selected="${S.tab === 'tasks'}">작업<span class="cnt">${ts.filter(t => t.status !== 'done').length}</span></button>
      <button role="tab" data-act="tab" data-tab="chat" aria-selected="${S.tab === 'chat'}">대화</button>
      <button role="tab" data-act="tab" data-tab="files" aria-selected="${S.tab === 'files'}">자료<span class="cnt">${subs.length}</span></button>
    </div>${body}</div>`;
}
function drawerView() {
  const t = T(S.taskId), d = dday(t), mine = t.assignees.includes(S.me);
  let action = '';
  if (!isProf() && mine && t.status === 'assigned') action = `<div class="actbox"><b>새로 지시된 작업입니다.</b><div class="btns"><button class="btn primary" data-act="start">작업 시작</button></div></div>`;
  else if (!isProf() && mine && (t.status === 'doing' || t.status === 'revise')) action = `<form class="actbox" id="sub-form"><b>결과 제출${t.subs.length ? ` (v${t.subs.length + 1})` : ''}</b>
    <div class="field"><label for="sub-memo">메모</label><textarea id="sub-memo" placeholder="무엇을 했는지, 확인해 주셨으면 하는 점"></textarea></div>
    <div class="field"><label for="sub-files">파일</label><input id="sub-files" type="file" multiple>${S.pendingFiles.length ? `<div>${S.pendingFiles.map(f => `<div class="file">${esc(f.name)} <span class="muted">${fmtSize(f.size)}</span></div>`).join('')}</div>` : ''}</div>
    <div class="field"><label for="sub-link">또는 링크 (큰 데이터·코드는 Drive, GitHub 링크로)</label><input id="sub-link" placeholder="https://"></div>
    <div class="btns"><button class="btn primary" type="submit">제출하기</button><span class="small muted" id="sub-err"></span></div></form>`;
  else if (isProf() && t.status === 'submitted') action = `<div class="actbox"><b>v${t.subs.length} 제출을 확인해 주세요</b>
    <div class="field"><label for="rv-note">의견 (수정 요청 시 필수)</label><textarea id="rv-note" placeholder="수정할 점이나 확인 의견"></textarea></div>
    <div class="btns"><button class="btn primary" data-act="approve">완료 처리</button><button class="btn warn" data-act="revise">수정 요청</button><span class="small muted" id="rv-err"></span></div></div>`;
  return `<div class="scrim" data-act="close"></div><aside class="drawer" aria-label="작업 상세">
    <button class="close" data-act="close">닫기 ✕</button>
    <div style="display:grid;gap:8px"><span class="muted small">${esc(P(t.pid).name)}</span><h2>${esc(t.title)}</h2></div>
    <dl class="dl"><dt>상태</dt><dd><span class="st ${t.status}">${STATUS[t.status]}</span></dd>
      <dt>마감</dt><dd><span class="dd ${d.cls}">${d.label}</span><span class="num">${fmtDue(t.due)}</span></dd>
      <dt>담당</dt><dd>${t.assignees.map(u => av(u) + esc(U(u).name)).join(' ')}</dd></dl>
    ${t.desc ? `<p class="desc">${esc(t.desc)}</p>` : ''}
    ${action}
    <div class="blk"><h3>제출 이력</h3>${t.subs.length ? [...t.subs].reverse().map(s => `<div class="ver"><div class="vh"><span class="vtag">v${s.v}</span><b>${esc(U(s.by).name)}</b><span class="muted small">${fmtAt(s.at)}</span></div>
      ${s.memo ? `<div>${esc(s.memo)}</div>` : ''}${s.files.map(f => `<div class="file">📄 ${esc(f.name)} <span class="muted">${fmtSize(f.size)}</span></div>`).join('')}${s.link ? `<div class="file">🔗 ${esc(s.link)}</div>` : ''}</div>`).join('') : '<span class="muted small">아직 제출이 없습니다.</span>'}</div>
    <div class="blk"><h3>댓글</h3>${t.comments.map(c => `<div class="cmt">${av(c.by)}<div><b>${esc(U(c.by).name)}</b> <span class="muted small">${fmtAt(c.at)}</span><div>${esc(c.text)}</div></div></div>`).join('') || '<span class="muted small">댓글이 없습니다.</span>'}
      <form class="compose" id="cmt-form" style="padding:0;border:0"><input id="cmt-in" placeholder="이 작업에 대한 댓글" autocomplete="off"><button class="btn" type="submit">등록</button></form></div>
  </aside>`;
}
function demoBar() {
  return `<div class="demo">시안 <button data-act="sim">다른 사람 활동 받아보기</button></div>`;
}

// ───────── 그리기 (입력 중인 값은 유지) ─────────
function render() {
  const app = document.getElementById('app');
  const keep = {}, focus = document.activeElement && document.activeElement.id;
  app.querySelectorAll('input[id],textarea[id]').forEach(el => { if (el.type !== 'file' && el.type !== 'checkbox') keep[el.id] = el.value; });
  const feedEl = document.getElementById('feed'), atBottom = !feedEl || feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 40;
  if (!S.me) app.innerHTML = loginView();
  else app.innerHTML = headerView() + `<main class="wrap pad">${S.view === 'overview' ? overviewView() : S.view === 'project' ? projectView() : homeView()}</main>` + (S.taskId ? drawerView() : '') + demoBar();
  for (const id in keep) { const el = document.getElementById(id); if (el) el.value = keep[id]; }
  if (focus) { const el = document.getElementById(focus); if (el) el.focus(); }
  const f = document.getElementById('feed'); if (f && atBottom) f.scrollTop = f.scrollHeight;
}

// ───────── 이벤트 ─────────
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (S.bellOpen && !e.target.closest('.npop')) { S.bellOpen = false; render(); } return; }
  const a = el.dataset.act, me = S.me;
  if (a !== 'bell' && a !== 'notif' && a !== 'readall') S.bellOpen = false;
  if (a === 'login') { S.me = el.dataset.id; S.view = 'home'; S.taskId = null; S.simStep = 0; clearTimeout(S.timer); S.timer = setTimeout(simulate, 7000); }
  else if (a === 'logout') { S.me = null; clearTimeout(S.timer); }
  else if (a === 'go') { S.view = el.dataset.view; S.taskId = null; }
  else if (a === 'project') { S.view = 'project'; S.pid = el.dataset.id; S.tab = 'tasks'; S.showAssign = false; }
  else if (a === 'tab') S.tab = el.dataset.tab;
  else if (a === 'task') { const t = T(el.dataset.id); S.taskId = t.id; S.pendingFiles = []; if (S.view !== 'project' || S.pid !== t.pid) { S.view = 'project'; S.pid = t.pid; S.tab = 'tasks'; } }
  else if (a === 'close') { S.taskId = null; S.pendingFiles = []; }
  else if (a === 'toggle-assign') S.showAssign = !S.showAssign;
  else if (a === 'bell') S.bellOpen = !S.bellOpen;
  else if (a === 'readall') S.notifs[me].forEach(n => n.read = true);
  else if (a === 'notif') return openNotif(S.notifs[me][+el.dataset.i]);
  else if (a === 'perm') return askPermission();
  else if (a === 'sim') return simulate();
  else if (a === 'start') { const t = T(S.taskId); t.status = 'doing'; }
  else if (a === 'approve' || a === 'revise') {
    const t = T(S.taskId), note = document.getElementById('rv-note').value.trim();
    if (a === 'revise' && !note) { document.getElementById('rv-err').textContent = '수정할 내용을 적어 주세요.'; return; }
    act(me, () => reviewTask(me, t, a === 'approve', note)); document.getElementById('rv-note').value = '';
  }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'only-mine') { S.onlyMine = e.target.checked; render(); }
  if (e.target.id === 'mute-sel') { S.mute[S.me + S.pid] = e.target.value; }
  if (e.target.id === 'sub-files') { S.pendingFiles = [...e.target.files].map(f => ({ name: f.name, size: f.size })); render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const me = S.me, id = e.target.id, val = x => document.getElementById(x).value.trim();
  if (id === 'chat-form') { const txt = val('chat-in'); if (!txt) return; document.getElementById('chat-in').value = ''; act(me, () => chat(me, S.pid, txt)); }
  if (id === 'cmt-form') { const txt = val('cmt-in'); if (!txt) return; document.getElementById('cmt-in').value = ''; act(me, () => commentTask(me, T(S.taskId), txt)); }
  if (id === 'sub-form') {
    const memo = val('sub-memo'), link = val('sub-link');
    if (!S.pendingFiles.length && !link) { document.getElementById('sub-err').textContent = '파일이나 링크 중 하나는 있어야 합니다.'; return; }
    act(me, () => submitTask(me, T(S.taskId), memo, S.pendingFiles, link));
    S.pendingFiles = []; document.getElementById('sub-memo').value = ''; document.getElementById('sub-link').value = '';
  }
  if (id === 'assign-form') {
    const who = [...document.querySelectorAll('input[name="as-who"]:checked')].map(x => x.value);
    if (!who.length) { document.getElementById('as-err').textContent = '담당자를 한 명 이상 골라 주세요.'; return; }
    const [y, mo, dd] = val('as-due').split('-').map(Number);
    act(me, () => assignTask(me, S.pid, val('as-title'), val('as-desc'), who, new Date(y, mo - 1, dd, 18)));
    S.showAssign = false; document.getElementById('as-title').value = ''; document.getElementById('as-desc').value = '';
  }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.taskId || S.bellOpen)) { S.taskId = null; S.bellOpen = false; render(); } });
render();
</script>
